# Production-like setup on one machine:
#   cp .env.example .env   # then fill in ENCRYPTION_KEY, APP_URL, ADMIN_*
#   docker compose up -d --build
#   docker compose run --rm worker pnpm db:seed
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: luora
      POSTGRES_PASSWORD: luora
      POSTGRES_DB: luora
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U luora']
      interval: 5s
      retries: 10

  # Runs database migrations on start, then order sync, label and stock jobs.
  worker:
    build: .
    restart: unless-stopped
    command: ['pnpm', 'worker']
    env_file: .env
    environment:
      DATABASE_URL: postgres://luora:luora@db:5432/luora
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    command: ['pnpm', 'start']
    env_file: .env
    environment:
      DATABASE_URL: postgres://luora:luora@db:5432/luora
    ports:
      - '3000:3000'
    depends_on:
      - worker

volumes:
  pgdata:
